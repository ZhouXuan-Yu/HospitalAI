openapi: 3.0.3
info:
  title: HospitalAI AI Service
  version: 1.0.0
paths:
  /v1/evidence/retrieve:
    post:
      summary: Retrieve approved or demonstration evidence snippets for a bounded recommendation request.
      responses:
        "200":
          description: Evidence snippets and explanation draft
  /v1/research/statistics/run:
    post:
      summary: Run fixed-version deterministic research statistics on a de-identified aggregate snapshot.
      responses:
        "200":
          description: Reproducible statistics result with input and output hashes.
