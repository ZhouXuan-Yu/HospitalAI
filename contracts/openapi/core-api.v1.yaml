openapi: 3.0.3
info:
  title: HospitalAI Core API
  version: 1.0.0
paths:
  /api/worklist:
    get:
      summary: List active encounters available to the doctor workbench.
      responses:
        "200":
          description: Encounter worklist from Core API database.
  /api/workbench/{encounterId}:
    get:
      summary: Build patient context, deterministic safety rules, controlled evidence, and candidates.
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workbench payload
  /api/recommendations/{recommendationId}/decision:
    post:
      summary: Adopt, modify, or reject a recommendation and create a simulated HIS draft when allowed.
      parameters:
        - name: recommendationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Persisted decision and draft status
  /api/recommendations:
    get:
      summary: List generated recommendation snapshots and state.
      responses:
        "200":
          description: Recommendation snapshots.
  /api/pharmacist/reviews:
    get:
      summary: List pharmacist review tasks.
      responses:
        "200":
          description: Pharmacist review queue.
  /api/pharmacist/reviews/{reviewId}/resolve:
    post:
      summary: Resolve a pending pharmacist review task.
      responses:
        "200":
          description: Review resolution state.
  /api/prescription-drafts/{draftId}:
    get:
      summary: Read prescription draft state.
      responses:
        "200":
          description: Prescription draft state.
  /api/prescription-drafts/{draftId}/callback:
    post:
      summary: Receive HIS adapter final status callback for a draft.
      responses:
        "200":
          description: Updated prescription draft state.
  /api/rules:
    get:
      summary: List clinical rules and rule cases.
      responses:
        "200":
          description: Rule governance payload.
    post:
      summary: Save or update a clinical rule draft.
      responses:
        "200":
          description: Rule draft status.
  /api/rules/{ruleId}/versions/{version}/submit-review:
    post:
      summary: Submit a rule version for review.
      responses:
        "200":
          description: Rule lifecycle status.
  /api/rules/{ruleId}/versions/{version}/publish:
    post:
      summary: Publish a reviewed rule version.
      responses:
        "200":
          description: Rule lifecycle status.
  /api/rules/{ruleId}/versions/{version}/withdraw:
    post:
      summary: Withdraw a rule version.
      responses:
        "200":
          description: Rule lifecycle status.
  /api/dose/calculate:
    post:
      summary: Calculate dose guidance from published deterministic hospital dose rules.
      responses:
        "200":
          description: Dose calculation result or safe unavailable state.
  /api/evidence/chunks:
    get:
      summary: Search published evidence chunks from the Core API database.
      responses:
        "200":
          description: Published evidence chunks only.
  /api/evidence/documents:
    get:
      summary: List evidence documents with governance status.
      responses:
        "200":
          description: Evidence document list.
    post:
      summary: Upload or register an evidence document as uploaded status.
      responses:
        "200":
          description: Evidence lifecycle status.
  /api/evidence/documents/{evidenceId}/parse:
    post:
      summary: Parse an evidence document into document blocks and evidence chunks.
      responses:
        "200":
          description: Evidence parse status.
  /api/evidence/documents/{evidenceId}/publish:
    post:
      summary: Publish reviewed evidence document and chunks.
      responses:
        "200":
          description: Evidence publish status.
  /api/evidence/documents/{evidenceId}/withdraw:
    post:
      summary: Withdraw evidence document and chunks from formal retrieval.
      responses:
        "200":
          description: Evidence withdraw status.
  /api/integration/his/snapshots/import:
    post:
      summary: Import a versioned HIS snapshot into the unified medical model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceSystem, sourceBatchId, payload]
              properties:
                sourceSystem: { type: string }
                sourceBatchId: { type: string }
                payload: { type: object }
      responses:
        "200":
          description: Import event status and upsert counts.
