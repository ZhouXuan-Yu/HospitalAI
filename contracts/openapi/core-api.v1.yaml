openapi: 3.0.3
info:
  title: HospitalAI Core API
  version: 1.0.0
paths:
  /api/worklist:
    get:
      summary: List active encounters available to the doctor workbench.
      responses:
        "200":
          description: Encounter worklist from Core API database.
  /api/workbench/{encounterId}:
    get:
      summary: Build patient context, deterministic safety rules, controlled evidence, and candidates.
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workbench payload
  /api/recommendations/{recommendationId}/decision:
    post:
      summary: Adopt, modify, or reject a recommendation and create a simulated HIS draft when allowed.
      parameters:
        - name: recommendationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Persisted decision and draft status
  /api/recommendations:
    get:
      summary: List generated recommendation snapshots and state.
      responses:
        "200":
          description: Recommendation snapshots.
  /api/pharmacist/reviews:
    get:
      summary: List pharmacist review tasks.
      responses:
        "200":
          description: Pharmacist review queue.
  /api/pharmacist/reviews/{reviewId}/resolve:
    post:
      summary: Resolve a pending pharmacist review task.
      responses:
        "200":
          description: Review resolution state.
  /api/collaboration/tasks:
    get:
      summary: List cross-department collaboration tasks.
      responses:
        "200":
          description: Collaboration task queue.
  /api/collaboration/tasks/{taskId}/resolve:
    post:
      summary: Resolve a cross-department collaboration task.
      responses:
        "200":
          description: Collaboration task resolution.
  /api/prescription-drafts/{draftId}:
    get:
      summary: Read prescription draft state.
      responses:
        "200":
          description: Prescription draft state.
  /api/prescription-drafts/{draftId}/callback:
    post:
      summary: Receive HIS adapter final status callback for a draft.
      responses:
        "200":
          description: Updated prescription draft state.
  /api/prescription-draft-write-tasks:
    get:
      summary: List reliable HIS draft write tasks.
      responses:
        "200":
          description: Draft write task queue.
  /api/prescription-draft-write-tasks/{taskId}/mark-failed:
    post:
      summary: Record a HIS adapter write failure and schedule retry or dead-letter.
      responses:
        "200":
          description: Draft write retry state.
  /api/patients/{patientId}/timeline:
    get:
      summary: List patient medication timeline events.
      responses:
        "200":
          description: Patient medication timeline.
    post:
      summary: Record a patient medication timeline event.
      responses:
        "200":
          description: Timeline event.
  /api/patients/{patientId}/feedback:
    get:
      summary: List medication feedback for a patient.
      responses:
        "200":
          description: Medication feedback list.
    post:
      summary: Record medication feedback.
      responses:
        "200":
          description: Medication feedback.
  /api/adr/reviews:
    get:
      summary: List adverse drug reaction review records by status.
      responses:
        "200":
          description: ADR review queue.
  /api/adr/reviews/{adrId}/resolve:
    post:
      summary: Confirm or reject an adverse drug reaction review.
      responses:
        "200":
          description: Updated ADR review status.
  /api/patients/{patientId}/outcomes:
    get:
      summary: List discharge outcomes for a patient.
      responses:
        "200":
          description: Discharge outcomes.
    post:
      summary: Record discharge outcome.
      responses:
        "200":
          description: Discharge outcome.
  /api/research/cohorts:
    get:
      summary: List research cohorts.
      responses:
        "200":
          description: Research cohorts.
    post:
      summary: Save a research cohort draft.
      responses:
        "200":
          description: Research cohort.
  /api/research/cohorts/{cohortId}/variables:
    get:
      summary: List research variable dictionary for a cohort.
      responses:
        "200":
          description: Research variables.
    post:
      summary: Save a research variable definition.
      responses:
        "200":
          description: Research variable.
  /api/research/cohorts/{cohortId}/quality-check:
    post:
      summary: Run research dataset quality checks.
      responses:
        "200":
          description: Research quality check.
  /api/research/cohorts/{cohortId}/freeze:
    post:
      summary: Freeze a research cohort version.
      responses:
        "200":
          description: Frozen research cohort.
  /api/research/cohorts/{cohortId}/analysis-runs:
    get:
      summary: List reproducible research analysis runs for a frozen cohort.
      responses:
        "200":
          description: Research analysis runs.
    post:
      summary: Run fixed-version descriptive statistics for a frozen cohort.
      responses:
        "200":
          description: Completed analysis run with input and output hashes.
  /api/research/cohorts/{cohortId}/analysis-tasks:
    get:
      summary: List reliable research analysis tasks for a cohort.
      responses:
        "200":
          description: Research analysis task queue.
    post:
      summary: Enqueue a reliable research analysis task for a frozen cohort.
      responses:
        "200":
          description: Queued research analysis task.
  /api/research/analysis-tasks/{taskId}/mark-failed:
    post:
      summary: Record a research analysis task failure and schedule retry or dead-letter.
      responses:
        "200":
          description: Research analysis retry state.
  /api/research/analysis-tasks/process-next:
    post:
      summary: Claim one eligible research analysis task and call the AI statistics service.
      responses:
        "200":
          description: Worker result with completed run or retry/dead-letter status.
  /api/research/cohorts/{cohortId}/exports:
    get:
      summary: List de-identified research export packages for a cohort.
      responses:
        "200":
          description: De-identified export packages.
    post:
      summary: Create a de-identified export package record for review and reproducibility.
      responses:
        "200":
          description: Generated de-identified export package.
  /api/research/artifacts:
    get:
      summary: Read a local research artifact by auditable URI and return content hash.
      responses:
        "200":
          description: Research artifact content and SHA-256 hash.
  /api/research/cohorts/{cohortId}/reports:
    get:
      summary: List report drafts for a cohort.
      responses:
        "200":
          description: Report drafts.
    post:
      summary: Create an auditable report draft for a frozen cohort.
      responses:
        "200":
          description: Report draft.
  /api/research/reports/{reportId}/review:
    post:
      summary: Mark a research report draft as reviewed.
      responses:
        "200":
          description: Reviewed report draft.
  /api/knowledge/submissions:
    get:
      summary: List knowledge submissions by status.
      responses:
        "200":
          description: Knowledge submission queue.
    post:
      summary: Submit a reviewed research report as a knowledge candidate.
      responses:
        "200":
          description: Knowledge submission pending multi-person review.
  /api/knowledge/submissions/{submissionId}/reviews:
    post:
      summary: Record one role's knowledge submission review decision.
      responses:
        "200":
          description: Knowledge review record; publishes after required approvals.
  /api/knowledge/submissions/{submissionId}/withdraw:
    post:
      summary: Withdraw a published or pending knowledge submission with audit.
      responses:
        "200":
          description: Withdrawn knowledge submission.
  /api/rules:
    get:
      summary: List clinical rules and rule cases.
      responses:
        "200":
          description: Rule governance payload.
    post:
      summary: Save or update a clinical rule draft.
      responses:
        "200":
          description: Rule draft status.
  /api/rules/{ruleId}/versions/{version}/submit-review:
    post:
      summary: Submit a rule version for review.
      responses:
        "200":
          description: Rule lifecycle status.
  /api/rules/{ruleId}/versions/{version}/publish:
    post:
      summary: Publish a reviewed rule version.
      responses:
        "200":
          description: Rule lifecycle status.
  /api/rules/{ruleId}/versions/{version}/withdraw:
    post:
      summary: Withdraw a rule version.
      responses:
        "200":
          description: Rule lifecycle status.
  /api/dose/calculate:
    post:
      summary: Calculate dose guidance from published deterministic hospital dose rules.
      responses:
        "200":
          description: Dose calculation result or safe unavailable state.
  /api/evidence/chunks:
    get:
      summary: Search published evidence chunks from the Core API database.
      responses:
        "200":
          description: Published evidence chunks only.
  /api/evidence/documents:
    get:
      summary: List evidence documents with governance status.
      responses:
        "200":
          description: Evidence document list.
    post:
      summary: Upload or register an evidence document as uploaded status.
      responses:
        "200":
          description: Evidence lifecycle status.
  /api/evidence/documents/{evidenceId}/parse:
    post:
      summary: Parse an evidence document into document blocks and evidence chunks.
      responses:
        "200":
          description: Evidence parse status.
  /api/evidence/documents/{evidenceId}/publish:
    post:
      summary: Publish reviewed evidence document and chunks.
      responses:
        "200":
          description: Evidence publish status.
  /api/evidence/documents/{evidenceId}/withdraw:
    post:
      summary: Withdraw evidence document and chunks from formal retrieval.
      responses:
        "200":
          description: Evidence withdraw status.
  /api/integration/his/snapshots/import:
    post:
      summary: Import a versioned HIS snapshot into the unified medical model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceSystem, sourceBatchId, payload]
              properties:
                sourceSystem: { type: string }
                sourceBatchId: { type: string }
                payload: { type: object }
      responses:
        "200":
          description: Import event status and upsert counts.
